<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правовой Анализатор Рекламы (AI Edition)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f9f9f9; color: #333; line-height: 1.6; }
        .container { text-align: center; }
        h1 { color: #222; }
        p { color: #555; }
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; cursor: pointer; }
        .btn { border: 2px solid #007bff; color: white; background-color: #007bff; padding: 15px 30px; border-radius: 8px; font-size: 20px; font-weight: bold; transition: all 0.2s; }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .upload-btn-wrapper:hover .btn { background-color: #0056b3; border-color: #0056b3; }
        #fileName { margin-top: 15px; color: #333; font-style: italic; }
        #results { margin-top: 30px; text-align: left; border-top: 1px solid #eee; padding-top: 20px; }
        .result-item { padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid; }
        .success { background-color: #e9f7ef; color: #1d6a43; border-color: #4CAF50; }
        .warning { background-color: #fff8e1; color: #7a630a; border-color: #ffc107; }
        .critical { background-color: #fbeae5; color: #8a2a17; border-color: #f44336; }
        pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; font-size: 15px; line-height: 1.7; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Правовой Анализатор Рекламы</h1>
        <p>Загрузите рекламный материал в формате PDF, JPEG или PNG для анализа.</p>

        <div class="upload-btn-wrapper">
            <button class="btn">Выбрать файл</button>
            <input type="file" id="adFile" onchange="uploadAndAnalyze()" accept=".pdf,.jpeg,.jpg,.png,.txt"/>
        </div>
        <p id="fileName"></p>
    </div>

    <div id="results">
        <!-- Здесь появятся результаты проверки -->
    </div>

    <script>
        function uploadAndAnalyze() {
            const fileInput = document.getElementById('adFile');
            const file = fileInput.files[0];
            const resultsDiv = document.getElementById('results');
            const fileNameDiv = document.getElementById('fileName');

            if (!file) { return; }

            fileNameDiv.textContent = `Выбран файл: ${file.name}`;
            resultsDiv.innerHTML = '<p style="text-align: center;">Загрузка и анализ... Это может занять до минуты для больших изображений.</p>';

            // Мы отправляем не текст, а сам файл в специальном формате FormData
            const formData = new FormData();
            formData.append('file', file);

            const apiUrl = '/api/check';

            fetch(apiUrl, {
                method: 'POST',
                body: formData // Тело запроса теперь - это FormData с файлом
            })
            .then(response => {
                if (!response.ok) { throw new Error(`Ошибка сервера: ${response.status}`); }
                return response.json();
            })
            .then(data => {
                resultsDiv.innerHTML = ''; 
                if (data.error) {
                    const resultElement = document.createElement('div');
                    resultElement.className = 'result-item critical';
                    resultElement.textContent = 'Произошла ошибка: ' + data.error;
                    resultsDiv.appendChild(resultElement);
                } else {
                    const resultElement = document.createElement('pre');
                    resultElement.className = 'result-item success';
                    resultElement.textContent = data.results;
                    resultsDiv.appendChild(resultElement);
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                resultsDiv.innerHTML = `<div class="result-item critical">Не удалось выполнить проверку: ${error.message}.</div>`;
            });
        }
    </script>

</body>
</html>
